services:
  - type: web
    name: claimguard-ai-backend
    runtime: python
    region: singapore
    plan: free
    numInstances: 1
    rootDir: backend
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./claimguard.db
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: preview
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: STAFF_AUTH_DISABLED
        value: "true"
      - key: DEBUG
        value: "false"
