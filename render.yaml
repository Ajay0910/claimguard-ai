services:
  - type: web
    name: claimguard-ai-backend
    runtime: python
    region: singapore
    plan: starter
    numInstances: 1
    rootDir: backend
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: claimguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # Set to the exact HTTPS patient and staff frontend origins
      - key: STAFF_PROXY_SHARED_SECRET
        sync: false   # Set to a random 256-bit value shared only with the trusted OIDC proxy
      - key: STAFF_REQUIRED_GROUP
        value: claimguard-staff
      - key: STAFF_AUTH_DISABLED
        value: "false"
      - key: DEBUG
        value: "false"
      - key: OPENAI_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: VLM_PROVIDER
        value: openai
    disk:
      name: claimguard-uploads
      mountPath: /var/data
      sizeGB: 10

databases:
  - name: claimguard-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: claimguard
    user: claimguard
